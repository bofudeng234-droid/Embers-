<body>
<canvas id="c"></canvas>
<div class="search-wrap">
  <input id="q" class="search-box" placeholder="在星图中搜索你刷过的视频… 比如「那个戴牛仔帽的鸵鸟」" autocomplete="off">

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const API = location.origin;
let scene, cam, renderer, composer, controls, points, raycaster, geo;
let STARS=[], IDX={}, nebulae=[], scanWave=null, flow=null;
const clock=new THREE.Clock();

function galaxyColor(g){
  if(g<0) return new THREE.Color(0x2a3052);
  return new THREE.Color().setHSL((g*0.61803398875)%1, 0.68, 0.62);
}

// 星芒贴图:亮核 + 柔晕 + 十字衍射条(真实长曝光星点质感)
function starTexture(){
  const s=256, cv=document.createElement('canvas'); cv.width=cv.height=s;
  const x=cv.getContext('2d'), C=s/2;
  // 柔晕
  let g=x.createRadialGradient(C,C,0,C,C,C);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.12,'rgba(255,255,255,0.85)');
  g.addColorStop(0.35,'rgba(255,255,255,0.25)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,s,s);
  // 十字衍射星芒
  x.globalCompositeOperation='lighter';
  for(const ang of [0,Math.PI/2]){
    x.save(); x.translate(C,C); x.rotate(ang);
    const lg=x.createLinearGradient(-C,0,C,0);
    lg.addColorStop(0,'rgba(255,255,255,0)');
    lg.addColorStop(0.5,'rgba(255,255,255,0.55)');
    lg.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=lg; x.fillRect(-C,-1.4,s,2.8); x.restore();
  }
  const t=new THREE.CanvasTexture(cv); t.needsUpdate=true; return t;
}
// 星云软体(湍流感靠多层叠加)
function nebulaTexture(){
  const s=256, cv=document.createElement('canvas'); cv.width=cv.height=s;
  const x=cv.getContext('2d'), C=s/2;
  const g=x.createRadialGradient(C,C,s*0.04,C,C,C);
  g.addColorStop(0,'rgba(255,255,255,0.9)');
  g.addColorStop(0.3,'rgba(255,255,255,0.35)');
  g.addColorStop(0.7,'rgba(255,255,255,0.08)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,s,s);
  const t=new THREE.CanvasTexture(cv); return t;
}
const STAR_TEX=starTexture(), NEB_TEX=nebulaTexture();

init();

async function init(){
  scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x01020a,0.0028);
  cam=new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 4000);
  cam.position.set(0,0,175);

  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;   // 电影色调映射
  renderer.toneMappingExposure=1.0;
  renderer.outputColorSpace=THREE.SRGBColorSpace;

  // 后处理:Render → Bloom → Output
  composer=new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,cam));
  const bloom=new UnrealBloomPass(
    new THREE.Vector2(innerWidth,innerHeight), 0.7, 0.55, 0.0);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  controls=new OrbitControls(cam,renderer.domElement);
  controls.enableDamping=true; controls.dampingFactor=0.06;
  controls.autoRotate=true; controls.autoRotateSpeed=0.2;

  addGalaxyBand();
  raycaster=new THREE.Raycaster();
  raycaster.params.Points.threshold=2.4;
  addEventListener('resize',onResize);
  renderer.domElement.addEventListener('pointermove',onHover);
  renderer.domElement.addEventListener('click',onClick);
  document.getElementById('q').addEventListener('keydown',e=>{
    if(e.key==='Enter') doSearch(e.target.value.trim()); });
  document.getElementById('backBtn').addEventListener('click',resetView);
  addEventListener('keydown',e=>{ if(e.key==='Escape') resetView(); });
  await loadStars();
  animate();
}

// --- 3D value noise + fbm(CPU 预计算银河密度,零运行时开销)---
function hash3(x,y,z){ const s=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;
  return s-Math.floor(s); }
function vnoise(x,y,z){
  const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);
  const xf=x-xi,yf=y-yi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
  const L=(a,b,t)=>a+(b-a)*t;
  return L(L(L(hash3(xi,yi,zi),hash3(xi+1,yi,zi),u),
             L(hash3(xi,yi+1,zi),hash3(xi+1,yi+1,zi),u),v),
           L(L(hash3(xi,yi,zi+1),hash3(xi+1,yi,zi+1),u),
             L(hash3(xi,yi+1,zi+1),hash3(xi+1,yi+1,zi+1),u),v),w);
}
function fbm(x,y,z){ let f=0,a=0.5,fr=1;
  for(let o=0;o<4;o++){ f+=a*vnoise(x*fr,y*fr,z*fr); a*=0.5; fr*=2.05; }
  return f;
}

// 银河带:倾斜薄盘 + fbm 调制(亮团/暗尘缝),蓝白渐变 — 浸没整个星图
function addGalaxyBand(){
  const N=5500;
  // 银河盘的基:倾斜法线 + 盘内两正交轴
  const nrm=new THREE.Vector3(0.28,1,0.22).normalize();
  const ax=new THREE.Vector3(1,0,0).cross(nrm).normalize();
  const ay=nrm.clone().cross(ax).normalize();
  const pos=[],col=[],siz=[];
  const cBlue=new THREE.Color(0x3a5a9c), cWhite=new THREE.Color(0xdce8ff);
  let made=0, tries=0;
  while(made<N && tries<N*8){
    tries++;
    const r=Math.pow(Math.random(),0.6)*230;     // 盘内半径(跟星点场同量级,包裹而非天边)
    const th=Math.random()*6.283;
    let g=0; for(let k=0;k<3;k++) g+=(Math.random()-0.5);
    const thick=g*28;                              // 沿法线高斯薄(更"带"感)
    const P=ax.clone().multiplyScalar(Math.cos(th)*r)
      .add(ay.clone().multiplyScalar(Math.sin(th)*r))
      .add(nrm.clone().multiplyScalar(thick));
    // fbm 密度:低于阈值=暗尘缝,丢弃 → 自然丝缕
    const d=fbm(P.x*0.014+10,P.y*0.014,P.z*0.014-7);  // 期望~0.47
    const dens=THREE.MathUtils.clamp((d-0.30)/0.45,0,1);
    // 暗尘缝保留 22% 基底,亮团几乎全保留 → 明暗丝缕但整体足够亮
    if(Math.random()>0.22+dens*0.78) continue;
    pos.push(P.x,P.y,P.z);
    const c=cBlue.clone().lerp(cWhite,Math.pow(dens,1.6));
    col.push(c.r,c.g,c.b);
    siz.push(1.8+dens*3.6);
    made++;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('aColor',new THREE.Float32BufferAttribute(col,3));
  g.setAttribute('aSize',new THREE.Float32BufferAttribute(siz,1));
  scene.add(new THREE.Points(g,new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{uTex:{value:STAR_TEX}},
    vertexShader:`attribute vec3 aColor; attribute float aSize;
      varying vec3 vC;
      void main(){ vC=aColor;
        vec4 mv=modelViewMatrix*vec4(position,1.0);
        gl_PointSize=aSize*(300.0/-mv.z);
        gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`uniform sampler2D uTex; varying vec3 vC;
      void main(){ vec4 t=texture2D(uTex,gl_PointCoord); if(t.a<0.01) discard;
        gl_FragColor=vec4(vC*0.65, t.a*0.3); }`})));
}

async function loadStars(){
  let data;
  try{ data=await (await fetch(API+'/starfield')).json(); }
  catch(e){ document.getElementById('hint').textContent='✗ 连不上 /starfield'; return; }
  if(!data.ready||!data.stars.length){
    document.getElementById('hint').textContent=
      '星图未生成 — 先跑: python -m pipeline.starfield'; return; }
  document.getElementById('hint').style.display='none';
  STARS=data.stars; const N=STARS.length;
  const pos=new Float32Array(N*3),col=new Float32Array(N*3),
        siz=new Float32Array(N),hl=new Float32Array(N),ph=new Float32Array(N);
  const gpts={};
  STARS.forEach((s,i)=>{
    IDX[s.id]=i;
    pos[i*3]=s.x; pos[i*3+1]=s.y; pos[i*3+2]=s.z;
    const c=galaxyColor(s.g);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
    siz[i]=s.g<0?2.0:3.2; hl[i]=0; ph[i]=Math.random()*6.283;
    if(s.g>=0)(gpts[s.g]=gpts[s.g]||[]).push(new THREE.Vector3(s.x,s.y,s.z));
  });
  geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aColor',new THREE.BufferAttribute(col,3));
  geo.setAttribute('aSize',new THREE.BufferAttribute(siz,1));
  geo.setAttribute('aHighlight',new THREE.BufferAttribute(hl,1));
  geo.setAttribute('aPhase',new THREE.BufferAttribute(ph,1));

  const mat=new THREE.ShaderMaterial({
    uniforms:{ uTime:{value:0}, uDim:{value:0}, uTex:{value:STAR_TEX} },
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader:`
      attribute vec3 aColor; attribute float aSize;
      attribute float aHighlight; attribute float aPhase;
      varying vec3 vC; varying float vH; uniform float uTime;
      void main(){
        vC=aColor; vH=aHighlight;
        float tw=0.82+0.18*sin(uTime*2.4+aPhase);          // 微闪烁
        vec4 mv=modelViewMatrix*vec4(position,1.0);
        float pulse=1.0+max(aHighlight,0.0)*(1.1+0.4*sin(uTime*5.0));
        gl_PointSize=aSize*tw*pulse*(420.0/-mv.z);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      varying vec3 vC; varying float vH;
      uniform float uDim; uniform sampler2D uTex;
      void main(){
        vec4 tx=texture2D(uTex,gl_PointCoord);
        if(tx.a<0.01) discard;
        float h=max(vH,0.0);
        // HDR:命中爆发增益,普通星也略过曝喂给 bloom
        vec3 col=mix(vC,vec3(1.0),h*0.28) * (0.95+h*0.95);
        float dim=(vH<=0.0)?(1.0-uDim*0.8):1.0;
        float gray=dot(col,vec3(0.33));
        col=mix(col,vec3(gray),(vH<=0.0)?uDim*0.5:0.0);
        gl_FragColor=vec4(col*dim, tx.a*(0.7+0.3*h));
      }`
  });
  points=new THREE.Points(geo,mat);
  scene.add(points);

  // 星云 = 粒子团(多核高斯散布,有颗粒结构;不再用模糊 sprite)
  Object.entries(gpts).forEach(([gid,vs])=>{
    const c=new THREE.Vector3();
    vs.forEach(v=>c.add(v)); c.multiplyScalar(1/vs.length);
    let rad=8; vs.forEach(v=>rad=Math.max(rad,v.distanceTo(c)));
    const gc=galaxyColor(+gid);
    const cnt=Math.min(420,Math.max(120,vs.length*6));
    // 带长轴 = 成员里最远两点方向(n 小,n² 可接受)
    let pa=vs[0],pb=vs[0],md=-1;
    for(let i=0;i<vs.length;i++) for(let j=i+1;j<vs.length;j++){
      const dd=vs[i].distanceToSquared(vs[j]);
      if(dd>md){ md=dd; pa=vs[i]; pb=vs[j]; } }
    let axisL=pb.clone().sub(pa);
    if(axisL.lengthSq()<1e-6) axisL.set(1,0,0);
    axisL.normalize();
    const up=Math.abs(axisL.y)>0.9?new THREE.Vector3(1,0,0):new THREE.Vector3(0,1,0);
    const axisW=up.clone().cross(axisL).normalize();
    const axisT=axisL.clone().cross(axisW).normalize();
    const halfLen=Math.max(rad*1.5,12);
    const gauss=()=>{ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random();
      return Math.sqrt(-2*Math.log(u))*Math.cos(6.283*v); };
    const pa3=[],ps3=[]; let mk=0,tr=0;
    while(mk<cnt && tr<cnt*5){
      tr++;
      const u=(Math.random()*2-1)*halfLen;        // 沿带长
      const wv=gauss()*rad*0.24;                   // 带宽(窄)
      const tv=gauss()*rad*0.14;                   // 带厚(更窄)
      const P=c.clone()
        .add(axisL.clone().multiplyScalar(u))
        .add(axisW.clone().multiplyScalar(wv))
        .add(axisT.clone().multiplyScalar(tv));
      const dn=fbm(P.x*0.05+(+gid),P.y*0.05,P.z*0.05-3);  // 丝缕调制
      const dens=THREE.MathUtils.clamp((dn-0.32)/0.42,0,1);
      if(Math.random()>0.3+dens*0.7) continue;
      pa3.push(P.x,P.y,P.z); ps3.push(0.6+dens*1.7); mk++;
    }
    const ng=new THREE.BufferGeometry();
    ng.setAttribute('position',new THREE.Float32BufferAttribute(pa3,3));
    ng.setAttribute('aSize',new THREE.Float32BufferAttribute(ps3,1));
    const nm=new THREE.ShaderMaterial({
      uniforms:{uTime:{value:0},uBoost:{value:0},
        uColor:{value:gc},uTex:{value:STAR_TEX}},
      transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
      vertexShader:`attribute float aSize; uniform float uTime,uBoost;
        varying float vF;
        void main(){ vF=0.5+0.5*sin(uTime*0.6+position.x*0.3+position.y*0.2);
          vec4 mv=modelViewMatrix*vec4(position,1.0);
          gl_PointSize=aSize*(1.0+uBoost*0.9)*(300.0/-mv.z);
          gl_Position=projectionMatrix*mv; }`,
      fragmentShader:`uniform sampler2D uTex; uniform vec3 uColor;
        uniform float uBoost; varying float vF;
        void main(){ vec4 t=texture2D(uTex,gl_PointCoord); if(t.a<0.01) discard;
          float a=t.a*(0.045+0.03*vF)*(1.0+uBoost*2.8);
          gl_FragColor=vec4(uColor*(0.7+uBoost*0.7), a); }`});
    const npts=new THREE.Points(ng,nm); scene.add(npts);
    nebulae.push({mat:nm,gid:+gid,center:c,boost:0});
  });

  document.getElementById('hud').innerHTML=
    `<b>${N}</b> 颗星 · <b>${Object.keys(data.galaxies).length}</b> 个星系 · 拖拽旋转 滚轮缩放`;
  document.getElementById('legend').innerHTML=
    Object.entries(data.galaxies).filter(([g])=>g!=='-1')
    .sort((a,b)=>b[1]-a[1]).slice(0,16).map(([g,n])=>{
      const c=galaxyColor(+g);
      return `星系${g} · ${n}<i style="background:#${c.getHexString()};color:#${c.getHexString()}"></i>`;
    }).join('<br>');
}

// ===== 科幻搜索序列(可中断) =====
let seqToken=0;
function abortSeq(){ seqToken++; }
async function doSearch(query){
  if(!query||!points) return;
  const my=++seqToken;
  document.body.classList.add('scanning');
  let hits=[];
  try{
    const r=await fetch(API+'/search',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({query,top_k:10,expand:true,rerank:false})});
    hits=(await r.json()).hits||[];
  }catch(e){}
  if(my!==seqToken) return;
  document.body.classList.remove('scanning');

  tween(v=>{ if(points) points.material.uniforms.uDim.value=v; },
        points.material.uniforms.uDim.value,1,450,my);
  const hl=geo.getAttribute('aHighlight');
  for(let i=0;i<hl.count;i++) hl.array[i]=0;
  hl.needsUpdate=true;

  const valid=hits.map(h=>IDX[h.id]).filter(i=>i!==undefined);
  if(valid.length){
    const mid=new THREE.Vector3();
    valid.forEach(i=>mid.add(new THREE.Vector3(STARS[i].x,STARS[i].y,STARS[i].z)));
    mid.multiplyScalar(1/valid.length);
    flyCam(mid.clone().normalize().multiplyScalar(270),mid,650,my);
  }
  for(let r=0;r<hits.length;r++){
    if(my!==seqToken) return;
    await sleep(r===0?720:150);
    const i=IDX[hits[r].id]; if(i===undefined) continue;
    const tg=r===0?1.0:0.6;
    tween(v=>{ if(geo){ hl.array[i]=v; hl.needsUpdate=true; } },1.2*tg,tg,420,my);
  }
  if(my!==seqToken) return;
  drawFlow(hits);
  const hitG=new Set(valid.map(i=>STARS[i].g));
  nebulae.forEach(n=> n.boost=hitG.has(n.gid)?1:0 );
  if(hits[0]&&IDX[hits[0].id]!==undefined){
    await sleep(560); if(my!==seqToken) return;
    const s=STARS[IDX[hits[0].id]],tp=new THREE.Vector3(s.x,s.y,s.z);
    flyCam(tp.clone().normalize().multiplyScalar(tp.length()+52),tp,900,my);
  }
  const rs=document.getElementById('results');
  rs.innerHTML=hits.map((h,i)=>{
    let fd=[]; try{ fd=JSON.parse(h.frame_desc||'[]'); }catch(_){}
    if(!Array.isArray(fd)) fd=[];
    const pd=h.path_distances||{};
    const sb=(h.sources||[]).map(s=>{
      const d=pd[s]; const dv=(d!==undefined)?` d=${(+d).toFixed(2)}`:'';
      return `<span class="sb sb-${s}">${s}${dv}</span>`; }).join('');
    const fused=(h.distance!=null)?(+h.distance).toFixed(3):'-';
    const tr=h.transcript||'';
    return `<div class="res ${i===0?'top':''}" style="animation-delay:${i*45}ms"
        data-id="${h.id}">
      <div class="hd">
        <div class="ti"><span class="rk">#${i+1}</span>${esc(h.title||h.id)}</div>
        <div class="fd">融合 d=${fused}</div></div>
      ${sb?`<div class="sbs">${sb}</div>`:''}
      ${h.caption?`<div class="cap">${esc(h.caption)}</div>`:''}
      ${fd.length?`<div class="nt"><b>画面</b>${esc(fd.join(' · ').slice(0,150))}</div>`:''}
      ${tr?`<div class="nt"><b>音频</b>${esc(tr.slice(0,120))}${tr.length>120?'…':''}</div>`:''}
    </div>`;
  }).join('');
  rs.style.display=hits.length?'block':'none';
  document.getElementById('backBtn').style.display=hits.length?'block':'none';
  rs.querySelectorAll('.res').forEach(el=>el.onclick=()=>{
    const h=hits.find(x=>x.id===el.dataset.id); if(h&&h.url) open(h.url,'_blank'); });
}

// 返回主界面:清检索态,平滑恢复全景星空
function resetView(){
  abortSeq();                                  // 中断进行中的搜索序列
  if(geo){ const hl=geo.getAttribute('aHighlight');
    for(let i=0;i<hl.count;i++) hl.array[i]=0; hl.needsUpdate=true; }
  if(points) tween(v=>{ points.material.uniforms.uDim.value=v; },
    points.material.uniforms.uDim.value,0,550);   // 非命中星渐亮回来
  if(flow){ scene.remove(flow); flow.geometry.dispose(); flow=null; }
  nebulae.forEach(n=>n.boost=0);
  document.getElementById('results').style.display='none';
  document.getElementById('backBtn').style.display='none';
  document.getElementById('q').value='';
  flyCam(new THREE.Vector3(0,0,175), new THREE.Vector3(0,0,0), 1100);
}

// 真·粒子沿管道流动:一串粒子沿 top1↔命中 循环推进,中段亮两头淡
function drawFlow(hits){
  if(flow){ scene.remove(flow); flow.geometry.dispose(); flow=null; }
  const idx=hits.map(h=>IDX[h.id]).filter(i=>i!==undefined);
  if(idx.length<2) return;
  const A=new THREE.Vector3(STARS[idx[0]].x,STARS[idx[0]].y,STARS[idx[0]].z);
  const per=30, tot=(idx.length-1)*per;
  const aA=new Float32Array(tot*3),aB=new Float32Array(tot*3),
        aT=new Float32Array(tot),aSpd=new Float32Array(tot);
  let p=0;
  for(let k=1;k<idx.length;k++){
    const B=new THREE.Vector3(STARS[idx[k]].x,STARS[idx[k]].y,STARS[idx[k]].z);
    for(let j=0;j<per;j++){
      aA[p*3]=A.x;aA[p*3+1]=A.y;aA[p*3+2]=A.z;
      aB[p*3]=B.x;aB[p*3+1]=B.y;aB[p*3+2]=B.z;
      aT[p]=j/per; aSpd[p]=0.16+Math.random()*0.05; p++;
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(tot*3),3));
  g.setAttribute('aA',new THREE.BufferAttribute(aA,3));
  g.setAttribute('aB',new THREE.BufferAttribute(aB,3));
  g.setAttribute('aT',new THREE.BufferAttribute(aT,1));
  g.setAttribute('aSpd',new THREE.BufferAttribute(aSpd,1));
  flow=new THREE.Points(g,new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{uTime:{value:0},uTex:{value:STAR_TEX}},
    vertexShader:`attribute vec3 aA; attribute vec3 aB;
      attribute float aT; attribute float aSpd;
      uniform float uTime; varying float vT;
      void main(){ float t=fract(aT+uTime*aSpd); vT=t;
        vec3 pos=mix(aA,aB,t);
        vec4 mv=modelViewMatrix*vec4(pos,1.0);
        gl_PointSize=(2.0+7.0*(1.0-abs(t-0.5)*2.0))*(300.0/-mv.z);
        gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`uniform sampler2D uTex; varying float vT;
      void main(){ vec4 c=texture2D(uTex,gl_PointCoord); if(c.a<0.01) discard;
        gl_FragColor=vec4(vec3(0.45,0.9,1.0)*1.6,
          c.a*(0.2+0.8*(1.0-abs(vT-0.5)*2.0))); }`}));
  scene.add(flow);
}


function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function tween(set,from,to,dur,tok){
  const t0=performance.now();
  (function s(){ if(tok!==undefined&&tok!==seqToken) return;
    const k=Math.min(1,(performance.now()-t0)/dur), e=1-Math.pow(1-k,3);
    set(from+(to-from)*e); if(k<1) requestAnimationFrame(s); })();
}
let camAnim=null;
function flyCam(toP,toT,dur,tok){ camAnim={fromP:cam.position.clone(),toP,
  fromT:controls.target.clone(),toT,t0:performance.now(),dur,tok}; }

function onHover(e){
  if(!points) return;
  const m=new THREE.Vector2((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(m,cam);
  const hit=raycaster.intersectObject(points)[0], tip=document.getElementById('tip');
  if(hit){ tip.style.display='block'; tip.style.left=e.clientX+'px';
    tip.style.top=e.clientY+'px'; tip.textContent=STARS[hit.index].title; }
  else tip.style.display='none';
}
function onClick(e){
  if(!points) return; abortSeq();
  const m=new THREE.Vector2((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(m,cam);
  const hit=raycaster.intersectObject(points)[0];
  if(hit){ const s=STARS[hit.index]; if(s.url) open(s.url,'_blank'); }
}
function onResize(){ cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); }

function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  if(points) points.material.uniforms.uTime.value=t;
  if(flow) flow.material.uniforms.uTime.value=t;
  nebulae.forEach(n=>{
    const boost=n.boost||0;
    n.mat.uniforms.uTime.value=t;
    n.mat.uniforms.uBoost.value=boost;
    if(n.boost>0) n.boost=Math.max(0,n.boost-0.004);
  });
  if(camAnim){
    if(camAnim.tok!==undefined&&camAnim.tok!==seqToken){ camAnim=null; }
    else{ const k=Math.min(1,(performance.now()-camAnim.t0)/camAnim.dur),
      e=1-Math.pow(1-k,3);
      cam.position.lerpVectors(camAnim.fromP,camAnim.toP,e);
      controls.target.lerpVectors(camAnim.fromT,camAnim.toT,e);
      if(k>=1) camAnim=null; }
  }
  controls.update();
  composer.render();
}
function esc(s){ return (s||'').replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
</script>
